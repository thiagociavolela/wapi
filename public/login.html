<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#090a11">
  <title>Entrar · Central</title><link rel="stylesheet" href="/css/app.css?v=14">
</head>
<body class="login-page">
  <main class="login-card">
    <div class="brand-mark">C</div>
    <p class="eyebrow">CENTRAL DE ATENDIMENTO</p>
    <h1>Bem-vindo de volta</h1>
    <p class="muted">Entre para responder seus clientes pelo WhatsApp oficial.</p>
    <form id="login-form">
      <label>E-mail<input id="email" name="email" type="email" autocomplete="username" autocapitalize="none" spellcheck="false" required></label>
      <label>Senha<input id="password" name="password" type="password" autocomplete="current-password" required></label>
      <p id="error" class="form-error" aria-live="polite"></p>
      <button class="primary wide" type="submit">Entrar</button>
    </form>
  </main>
  <script type="module" src="/js/login.js?v=2"></script>
</body></html>
